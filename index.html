<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas SaaS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Lista de Tarefas</h1>

        <!-- O motor de busca local será injetado dinamicamente aqui pelo script.js -->

        <!-- Formulário de cadastro de novas tarefas -->
        <form id="form-tarefa">
            <input type="text" id="input-tarefa" placeholder="Insira a tarefa..." autocomplete="off">
            <button type="submit">Salvar</button>
        </form>

        <!-- Lista onde os cards de tarefas serão criados pelo JavaScript -->
        <ul id="lista-tarefas"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
